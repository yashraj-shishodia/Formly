services:
  - type: web
    name: formly-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./typeform.db
      - key: CORS_ORIGINS
        value: "http://localhost:3000,*"
      - key: SEED_ON_START
        value: "true"
